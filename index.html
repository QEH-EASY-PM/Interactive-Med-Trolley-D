<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>G10 Interactive Virtual Medication Trolley</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at center, #f0f4f8 0%, #d9e2ec 100%);
    }
    .font-cartoon {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 30px -5px rgba(30, 41, 59, 0.12), 0 4px 6px -2px rgba(30, 41, 59, 0.05);
    }
    .cartoon-btn {
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 0 rgba(15, 23, 42, 0.15);
    }
    .cartoon-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(15, 23, 42, 0.15);
    }
    .cartoon-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.15);
    }
    .active-nav {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border-color: #1d4ed8 !important;
      box-shadow: 0 4px 0 #1e40af !important;
    }
    .color-swatch, .cart-swatch {
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .color-swatch:hover, .cart-swatch:hover {
      transform: scale(1.15);
    }
    .color-swatch.selected, .cart-swatch.selected {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
      transform: scale(1.1);
    }
    .placing-mode-active {
      cursor: crosshair !important;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

  <script>
    // --- Disable Shortcuts & Context Menu to Prevent Viewing Original Code ---
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    document.addEventListener('keydown', (e) => {
      // F12 (DevTools)
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
      }
      // Ctrl+Shift+I / Cmd+Opt+I (Inspect), Ctrl+Shift+J / Cmd+Opt+J (Console), Ctrl+Shift+C (Element Picker)
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) {
        e.preventDefault();
        return false;
      }
      // Ctrl+U / Cmd+Opt+U (View Page Source)
      if ((e.ctrlKey || (e.metaKey && e.altKey)) && (e.key === 'U' || e.key === 'u')) {
        e.preventDefault();
        return false;
      }
      // Ctrl+S / Cmd+S (Save Page)
      if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's')) {
        e.preventDefault();
        return false;
      }
    });
  </script>

    <div id="status-desc" class="text-xs text-slate-500 mt-0.5">"MINI STOCK OF TOP UP MEDICATION" has been moved to the new location.</div>
  </div>

  <!-- WebGL Canvas Container -->
  <div id="webgl-container" class="w-full h-full"></div>

  <script>
    // --- Web Audio Synthesizer for Cartoon Drawer Sounds ---
    let audioCtx = null;
    let isSoundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playDrawerSound(isOpen) {
      if (!isSoundEnabled) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;

        const bufferSize = audioCtx.sampleRate * 0.18;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(isOpen ? 450 : 800, now);
        filter.frequency.exponentialRampToValueAtTime(isOpen ? 850 : 350, now + 0.16);
        filter.Q.value = 3.0;

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.09, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

        whiteNoise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        whiteNoise.start(now);

        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isOpen ? 380 : 260, now + 0.02);
        osc.frequency.exponentialRampToValueAtTime(isOpen ? 520 : 180, now + 0.08);

        oscGain.gain.setValueAtTime(0.12, now + 0.02);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(now + 0.02);
        osc.stop(now + 0.1);
      } catch (e) {
        console.warn('Audio playback error:', e);
      }
    }

    function playTapeSound() {
      if (!isSoundEnabled) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.06);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } catch (e) {}
    }

    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce5ef);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2.9, 2.3, 3.4);

    // Renderer (Shadow maps completely disabled)
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1.25, 0);
    controls.maxPolarAngle = Math.PI / 2 + 0.02;
    controls.minDistance = 1.8;
    controls.maxDistance = 7.5;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 1.2;

    // Ambient and Directional Lights (Zero shadows)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xb0c4de, 0.5);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const mainSun = new THREE.DirectionalLight(0xffffff, 0.8);
    mainSun.position.set(5, 8, 5);
    scene.add(mainSun);

    const fillLight = new THREE.DirectionalLight(0x90b4ce, 0.45);
    fillLight.position.set(-5, 4, -5);
    scene.add(fillLight);

    // Shared Materials
    const cartBodyMat = new THREE.MeshStandardMaterial({
      color: 0xedf0f5,
      roughness: 0.28,
      metalness: 0.06
    });

    const bumperMat = new THREE.MeshStandardMaterial({
      color: 0x22262d,
      roughness: 0.5,
      metalness: 0.2
    });

    const drawerFaceMat = new THREE.MeshStandardMaterial({
      color: 0x2563eb,
      roughness: 0.32,
      metalness: 0.08
    });

    const drawerHoverMat = new THREE.MeshStandardMaterial({
      color: 0x3b82f6,
      roughness: 0.25,
      metalness: 0.12,
      emissive: 0x1d4ed8,
      emissiveIntensity: 0.25
    });

    const trayInteriorMat = new THREE.MeshStandardMaterial({
      color: 0xf8fafc,
      roughness: 0.4,
      metalness: 0.02
    });

    const chromeMat = new THREE.MeshStandardMaterial({
      color: 0xe2e8f0,
      roughness: 0.2,
      metalness: 0.8
    });

    const wheelRubberMat = new THREE.MeshStandardMaterial({
      color: 0x1e293b,
      roughness: 0.8,
      metalness: 0.1
    });

    const wheelHubMat = new THREE.MeshStandardMaterial({
      color: 0x94a3b8,
      roughness: 0.3,
      metalness: 0.7
    });

    const cartGroup = new THREE.Group();
    scene.add(cartGroup);

    // Dimensions
    const CART_W = 1.48;
    const CART_H = 1.84;
    const CART_D = 1.08;
    const BASE_Y = 0.32;
    const CART_CENTER_Y = BASE_Y + CART_H / 2;

    // Main chassis cabinet
    const cabinetGeo = new THREE.BoxGeometry(CART_W, CART_H, CART_D);
    const cabinet = new THREE.Mesh(cabinetGeo, cartBodyMat);
    cabinet.name = "cart_cabinet";
    cabinet.position.set(0, CART_CENTER_Y, 0);
    cartGroup.add(cabinet);

    // Molded Top Surface
    const topSlabGeo = new THREE.BoxGeometry(CART_W + 0.14, 0.07, CART_D + 0.14);
    const topSlab = new THREE.Mesh(topSlabGeo, cartBodyMat);
    topSlab.name = "cart_top_slab";
    topSlab.position.set(0, BASE_Y + CART_H + 0.035, 0);
    cartGroup.add(topSlab);

    // Top Rim Edges
    const topRimFrontGeo = new THREE.BoxGeometry(CART_W + 0.14, 0.03, 0.02);
    const topRimSideGeo = new THREE.BoxGeometry(0.02, 0.03, CART_D + 0.1);
    const topRimF = new THREE.Mesh(topRimFrontGeo, bumperMat);
    topRimF.name = "cart_rim_f";
    topRimF.position.set(0, BASE_Y + CART_H + 0.08, (CART_D + 0.14) / 2 - 0.01);
    const topRimB = topRimF.clone();
    topRimB.name = "cart_rim_b";
    topRimB.position.z = -((CART_D + 0.14) / 2 - 0.01);
    const topRimL = new THREE.Mesh(topRimSideGeo, bumperMat);
    topRimL.name = "cart_rim_l";
    topRimL.position.set(-((CART_W + 0.14) / 2 - 0.01), BASE_Y + CART_H + 0.08, 0);
    const topRimR = topRimL.clone();
    topRimR.name = "cart_rim_r";
    topRimR.position.x = ((CART_W + 0.14) / 2 - 0.01);
    cartGroup.add(topRimF, topRimB, topRimL, topRimR);

    // Bottom Bumper Base
    const bumperBaseGeo = new THREE.BoxGeometry(CART_W + 0.12, 0.09, CART_D + 0.12);
    const bumperBase = new THREE.Mesh(bumperBaseGeo, bumperMat);
    bumperBase.name = "cart_bumper_base";
    bumperBase.position.set(0, BASE_Y - 0.045, 0);
    cartGroup.add(bumperBase);

    // Push Handle on Side 1
    const handleGroup = new THREE.Group();
    const handleBarGeo = new THREE.CylinderGeometry(0.016, 0.016, CART_D * 0.75, 16);
    const handleBar = new THREE.Mesh(handleBarGeo, chromeMat);
    handleBar.rotation.x = Math.PI / 2;
    handleBar.position.set(CART_W / 2 + 0.12, BASE_Y + CART_H - 0.04, 0);

    const postGeo = new THREE.CylinderGeometry(0.014, 0.014, 0.12, 16);
    const post1 = new THREE.Mesh(postGeo, chromeMat);
    post1.rotation.z = Math.PI / 2;
    post1.position.set(CART_W / 2 + 0.06, BASE_Y + CART_H - 0.04, CART_D * 0.32);
    const post2 = post1.clone();
    post2.position.z = -CART_D * 0.32;
    handleGroup.add(handleBar, post1, post2);
    cartGroup.add(handleGroup);

    const WHEEL_RADIUS = 0.1;
    const wheelPositions = [
      { x: -(CART_W / 2 - 0.08), z: (CART_D / 2 - 0.08) },
      { x: (CART_W / 2 - 0.08), z: (CART_D / 2 - 0.08) },
      { x: -(CART_W / 2 - 0.08), z: -(CART_D / 2 - 0.08) },
      { x: (CART_W / 2 - 0.08), z: -(CART_D / 2 - 0.08) }
    ];

    wheelPositions.forEach((pos, idx) => {
      const caster = new THREE.Group();
      caster.position.set(pos.x, WHEEL_RADIUS, pos.z);

      const stemGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.08, 16);
      const stem = new THREE.Mesh(stemGeo, chromeMat);
      stem.position.y = 0.09;
      caster.add(stem);

      const forkGeo = new THREE.BoxGeometry(0.09, 0.12, 0.08);
      const fork = new THREE.Mesh(forkGeo, chromeMat);
      fork.position.set(0, 0.04, -0.015);
      caster.add(fork);

      const tireGeo = new THREE.CylinderGeometry(WHEEL_RADIUS, WHEEL_RADIUS, 0.05, 24);
      tireGeo.rotateZ(Math.PI / 2);
      const tire = new THREE.Mesh(tireGeo, wheelRubberMat);
      caster.add(tire);

      const hubGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.054, 16);
      hubGeo.rotateZ(Math.PI / 2);
      const hub = new THREE.Mesh(hubGeo, wheelHubMat);
      caster.add(hub);

      if (idx % 2 === 0) {
        const brakeGeo = new THREE.BoxGeometry(0.02, 0.06, 0.04);
        const brake = new THREE.Mesh(brakeGeo, bumperMat);
        brake.position.set(0, 0.04, 0.03);
        brake.rotation.x = 0.3;
        caster.add(brake);
      }

      cartGroup.add(caster);
    });

    const drawersList = [];
    const interactiveMeshes = [];

    /**
     * Creates a 3D hollow drawer with clean flat front faceplate and open-top tray.
     */
    function createDrawer({
      id,
      face,
      name,
      width,
      height,
      depth,
      posX,
      posY,
      posZ,
      normal,
      slideDistance = 0.38
    }) {
      const drawerGroup = new THREE.Group();
      drawerGroup.position.set(posX, posY, posZ);

      const facePlateThick = 0.024;
      const faceGeo = new THREE.BoxGeometry(width - 0.016, height - 0.016, facePlateThick);
      const faceMesh = new THREE.Mesh(faceGeo, drawerFaceMat.clone());
      faceMesh.name = `mesh_face_${id}`;

      const frontUnit = new THREE.Group();
      frontUnit.add(faceMesh);

      if (face === 'Front') {
        frontUnit.position.set(0, 0, 0);
      } else if (face === 'Back') {
        frontUnit.rotation.y = Math.PI;
      }
      drawerGroup.add(frontUnit);

      // Hollow Tray Compartment
      const trayThick = 0.012;
      const trayW = width - 0.04;
      const trayH = height - 0.035;
      const trayL = depth;

      const trayGroup = new THREE.Group();

      const bottomGeo = new THREE.BoxGeometry(trayW, trayThick, trayL);
      const bottomMesh = new THREE.Mesh(bottomGeo, trayInteriorMat);
      bottomMesh.position.set(0, -trayH / 2 + trayThick / 2, -trayL / 2);
      trayGroup.add(bottomMesh);

      const wallLGeo = new THREE.BoxGeometry(trayThick, trayH, trayL);
      const wallL = new THREE.Mesh(wallLGeo, trayInteriorMat);
      wallL.position.set(-trayW / 2 + trayThick / 2, 0, -trayL / 2);
      trayGroup.add(wallL);

      const wallR = new THREE.Mesh(wallLGeo, trayInteriorMat);
      wallR.position.set(trayW / 2 - trayThick / 2, 0, -trayL / 2);
      trayGroup.add(wallR);

      const wallBGeo = new THREE.BoxGeometry(trayW, trayH, trayThick);
      const wallB = new THREE.Mesh(wallBGeo, trayInteriorMat);
      wallB.position.set(0, 0, -trayL + trayThick / 2);
      trayGroup.add(wallB);

      if (face === 'Front') {
        trayGroup.position.set(0, 0, 0);
      } else if (face === 'Back') {
        trayGroup.rotation.y = Math.PI;
      }
      drawerGroup.add(trayGroup);

      cartGroup.add(drawerGroup);

      const closedPos = new THREE.Vector3(posX, posY, posZ);
      const openPos = closedPos.clone().add(normal.clone().multiplyScalar(slideDistance));

      const drawerData = {
        id,
        face,
        name,
        group: drawerGroup,
        faceMesh: faceMesh,
        faceThickness: facePlateThick,
        closedPos,
        openPos,
        normal,
        progress: 0.0,
        targetProgress: 0.0,
        isOpen: false
      };

      faceMesh.userData = { drawerData };
      interactiveMeshes.push(faceMesh);
      drawersList.push(drawerData);

      return drawerData;
    }

    // === FRONT FACE (Normal: +Z) ===
    const frontZ = CART_D / 2 + 0.012;
    const frontCols = 5;
    const frontRowsTop = 3;

    const smallW = 0.245;
    const smallH = 0.165;
    const smallGapX = 0.024;
    const smallGapY = 0.022;

    const totalSmallGridW = (frontCols * smallW) + ((frontCols - 1) * smallGapX);
    const startSmallX = -totalSmallGridW / 2 + smallW / 2;
    const startSmallY = BASE_Y + CART_H - 0.14 - smallH / 2;

    // 15 Small Top Drawers
    for (let r = 0; r < frontRowsTop; r++) {
      for (let c = 0; c < frontCols; c++) {
        const x = startSmallX + c * (smallW + smallGapX);
        const y = startSmallY - r * (smallH + smallGapY);
        createDrawer({
          id: `F-T-R${r + 1}-C${c + 1}`,
          face: 'Front',
          name: `Front Top • Row ${r + 1}, Col ${c + 1}`,
          width: smallW,
          height: smallH,
          depth: 0.38,
          posX: x,
          posY: y,
          posZ: frontZ,
          normal: new THREE.Vector3(0, 0, 1),
          slideDistance: 0.36
        });
      }
    }

    // 3 Wide Horizontal Bottom Drawers
    const wideW = totalSmallGridW;
    const wideHeights = [0.18, 0.20, 0.26];
    const wideGapY = 0.025;
    let currentWideY = startSmallY - (frontRowsTop * (smallH + smallGapY)) - 0.025;

    for (let i = 0; i < 3; i++) {
      const h = wideHeights[i];
      const y = currentWideY - h / 2;
      createDrawer({
        id: `F-B-W${i + 1}`,
        face: 'Front',
        name: `Front Bottom • Wide Drawer ${i + 1}`,
        width: wideW,
        height: h,
        depth: 0.42,
        posX: 0,
        posY: y,
        posZ: frontZ,
        normal: new THREE.Vector3(0, 0, 1),
        slideDistance: 0.44
      });
      currentWideY -= (h + wideGapY);
    }

    // === BACK FACE (Normal: -Z) ===
    const backZ = -CART_D / 2 - 0.012;
    const backStartSmallX = totalSmallGridW / 2 - smallW / 2;

    // 15 Small Top Drawers
    for (let r = 0; r < frontRowsTop; r++) {
      for (let c = 0; c < frontCols; c++) {
        const x = backStartSmallX - c * (smallW + smallGapX);
        const y = startSmallY - r * (smallH + smallGapY);

    // Helper: calculate high-contrast text color based on background luminance
    function getContrastTextColor(hexColor) {
      if (!hexColor || hexColor.length < 6) return '#0f172a';
      const hex = hexColor.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16) || 0;
      const g = parseInt(hex.substring(2, 4), 16) || 0;
      const b = parseInt(hex.substring(4, 6), 16) || 0;
      const yiq = (r * 299 + g * 587 + b * 114) / 1000;
      return yiq >= 128 ? '#0f172a' : '#ffffff';
    }

    /**
     * Generates a sharp, dynamically sized canvas texture matching the true aspect ratio of the label.
     * Prevents text truncation, distortion, or clipping.
     */
    function generateLabelTexture(text, bgColor, labelW = 0.20, labelH = 0.07) {
      const aspect = Math.max(0.2, (labelW || 0.20) / Math.max(0.01, (labelH || 0.07)));
      const baseH = 256;
      const canvas = document.createElement('canvas');
      canvas.height = baseH;
      canvas.width = Math.max(128, Math.round(baseH * aspect));
      const ctx = canvas.getContext('2d');

      const strokeW = Math.max(4, Math.round(canvas.height * 0.045));
      const inset = strokeW / 2;
      const r = Math.min(canvas.height * 0.22, canvas.width * 0.12);
      const w = canvas.width - strokeW;
      const h = canvas.height - strokeW;
      const x = inset;
      const y = inset;

      // Draw rounded pill badge background
      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();

      // Badge outline border
      ctx.lineWidth = strokeW;
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.25)';
      ctx.stroke();

      // Text rendering with auto-fitting and fallbacks
      const textColor = getContrastTextColor(bgColor);
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const labelStr = (text || '').trim();
      if (labelStr.length > 0) {
        const padX = Math.max(14, canvas.width * 0.08);
        const maxW = canvas.width - padX * 2;
        const maxH = canvas.height * 0.68;

        let fontSize = Math.floor(canvas.height * 0.48);
        const fontStack = "'Fredoka', 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
        ctx.font = `bold ${fontSize}px ${fontStack}`;

        let measuredW = ctx.measureText(labelStr).width;
        if (measuredW > maxW) {
          fontSize = Math.floor(fontSize * (maxW / measuredW));
        }
        if (fontSize > maxH) {
          fontSize = Math.floor(maxH);
        }
        fontSize = Math.max(14, fontSize);

        ctx.font = `bold ${fontSize}px ${fontStack}`;
        ctx.fillText(labelStr, canvas.width / 2, canvas.height / 2);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.generateMipmaps = true;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      if (renderer && renderer.capabilities && renderer.capabilities.getMaxAnisotropy) {
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      }
      texture.needsUpdate = true;
      return texture;
    }

      setRelocateMode(false);
      if (ghostLabelMesh) ghostLabelMesh.visible = false;

      const editNotice = document.getElementById('label-edit-notice');
      if (editNotice) editNotice.classList.add('hidden');
      const relocateBtn = document.getElementById('btn-relocate-label');
      if (relocateBtn) relocateBtn.classList.add('hidden');
      const panelTitle = document.getElementById('label-panel-title');
      if (panelTitle) panelTitle.textContent = 'Med Cart Label Maker';
      if (placeBtnLabel) placeBtnLabel.textContent = 'Click Anywhere on Cart to Stick';
    }

    function selectLabelForEditing(labelMesh) {
      if (window.__DISABLE_LABEL_EDITING__ || window.__IS_COPY_VERSION__) return;
      if (!labelMesh || !labelMesh.userData) return;

      selectedLabel = labelMesh;
      setPlaceMode(false);
      setRemoveMode(false);
      setRelocateMode(false);
      if (ghostLabelMesh) ghostLabelMesh.visible = false;

      // Open label maker panel if closed
      if (labelMakerPanel) {
        labelMakerPanel.classList.remove('hidden');
        labelMakerPanel.classList.add('flex');
      }
      if (btnLabelPanel) {
        btnLabelPanel.classList.add('bg-indigo-800');
      }
      if (cartColorPanel) {
        cartColorPanel.classList.add('hidden');
        cartColorPanel.classList.remove('flex');
      }
      if (btnCartColorPanel) {
        btnCartColorPanel.classList.remove('bg-pink-800');
      }

      // Populate label state from existing label mesh
      labelState.text = labelMesh.userData.labelText || '';
      labelState.color = labelMesh.userData.labelColor || '#fef08a';
      labelState.width = labelMesh.userData.labelWidth || 0.20;
      labelState.height = labelMesh.userData.labelHeight || 0.07;

      // Update UI input controls
      if (labelTextInput) labelTextInput.value = labelState.text;
      if (sliderLabelW) sliderLabelW.value = labelState.width;
      if (sliderLabelH) sliderLabelH.value = labelState.height;
      if (labelWidthVal) labelWidthVal.textContent = `${labelState.width.toFixed(2)}m`;
      if (labelHeightVal) labelHeightVal.textContent = `${labelState.height.toFixed(2)}m`;

      // Select corresponding color swatch or custom picker
      let matchedSwatch = false;
      document.querySelectorAll('.color-swatch').forEach(s => {
        const isMatch = s.getAttribute('data-color') === labelState.color;
        s.classList.toggle('selected', isMatch);
        if (isMatch) matchedSwatch = true;
      });
      if (!matchedSwatch && customColorPicker) {
        customColorPicker.value = labelState.color;
      }

      // Show editing UI elements
      const editNotice = document.getElementById('label-edit-notice');
      if (editNotice) editNotice.classList.remove('hidden');
      const relocateBtn = document.getElementById('btn-relocate-label');
      if (relocateBtn) relocateBtn.classList.remove('hidden');
      const panelTitle = document.getElementById('label-panel-title');
      if (panelTitle) panelTitle.textContent = 'Edit & Resize Label';
      if (placeBtnLabel) placeBtnLabel.textContent = 'Create New Label Instead';

      updateLivePreview();
      updateGhostLabelPreview();
      playTapeSound();

      document.getElementById('status-face').textContent = 'Selected';
      document.getElementById('status-title').textContent = `Editing: "${labelState.text}"`;
      document.getElementById('status-desc').textContent = 'Edit text, color, adjust size sliders, or click "Relocate" to move.';
    }

    function updateSelectedLabelMesh() {
      if (!selectedLabel) return;
      selectedLabel.userData.labelText = labelState.text;
      selectedLabel.userData.labelColor = labelState.color;

      const newTex = generateLabelTexture(
        labelState.text || ' ',
        labelState.color,
        selectedLabel.userData.labelWidth,
        selectedLabel.userData.labelHeight
      );

      if (selectedLabel.material.map) selectedLabel.material.map.dispose();
      selectedLabel.material.map = newTex;
      selectedLabel.material.needsUpdate = true;
      saveToLocalStorage();
    }

    // AMENDED (Point 5): Optional `save` flag prevents saving 60x/sec while dragging sliders
    function updateSelectedLabelGeometry(save = true) {
      if (!selectedLabel) return;
      selectedLabel.userData.labelWidth = labelState.width;
      selectedLabel.userData.labelHeight = labelState.height;

      selectedLabel.geometry.dispose();
      selectedLabel.geometry = new THREE.PlaneGeometry(labelState.width, labelState.height);

      const newTex = generateLabelTexture(
        selectedLabel.userData.labelText || ' ',
        selectedLabel.userData.labelColor,
        labelState.width,
        labelState.height
      );

      if (selectedLabel.material.map) selectedLabel.material.map.dispose();
      selectedLabel.material.map = newTex;
      selectedLabel.material.needsUpdate = true;
      if (save) {
        saveToLocalStorage();
      }
    }

    function setRelocateMode(active) {
      if (window.__DISABLE_LABEL_EDITING__ || window.__IS_COPY_VERSION__) return;
      labelState.isRelocating = active;

      const btnRelocate = document.getElementById('btn-relocate-label');
      const btnRelocateText = document.getElementById('relocate-btn-text');

      if (active) {
        setPlaceMode(false);
        setRemoveMode(false);
        updateGhostLabelPreview();
        if (btnRelocate) {
          btnRelocate.classList.remove('bg-amber-500', 'hover:bg-amber-600');
          btnRelocate.classList.add('bg-emerald-600', 'hover:bg-emerald-700');

        document.body.classList.add('placing-mode-active');

        document.body.classList.remove('placing-mode-active');
        if (ghostLabelMesh) ghostLabelMesh.visible = false;
      }
    }

    function relocateSelectedLabel(intersect) {
      if (!selectedLabel) return;
      const hitObj = intersect.object;
      const hitFace = intersect.face;
      if (!hitObj || !hitFace) return;

      if (selectedLabel.parent) {
        selectedLabel.parent.remove(selectedLabel);
      }

      const localPoint = hitObj.worldToLocal(intersect.point.clone());
      const localNormal = hitFace.normal.clone().normalize();

      selectedLabel.position.copy(localPoint).addScaledVector(localNormal, 0.0035);

      const upVector = new THREE.Vector3(0, 1, 0);
      if (Math.abs(localNormal.y) > 0.85) {
        upVector.set(0, 0, -1);
      } else {
        upVector.set(0, 1, 0);
      }

      const targetLook = selectedLabel.position.clone().add(localNormal);
      selectedLabel.up.copy(upVector);
      selectedLabel.lookAt(targetLook);

      selectedLabel.userData.partId = hitObj.userData.cartPartId || 'mesh_cabinet';
      hitObj.add(selectedLabel);

      playTapeSound();

      document.getElementById('status-face').textContent = 'Relocated';
      document.getElementById('status-title').textContent = `Label Moved`;
      document.getElementById('status-desc').textContent = `"${selectedLabel.userData.labelText}" has been moved to the new location.`;

      if (ghostLabelMesh) ghostLabelMesh.visible = false;
      saveToLocalStorage();
    }

    function removeSingleLabel(labelMesh) {
      if (!labelMesh) return;
      if (selectedLabel === labelMesh) {
        deselectLabel();
      }
      const idx = allPlacedLabels.indexOf(labelMesh);
      if (idx !== -1) {
        allPlacedLabels.splice(idx, 1);
      }
      if (labelMesh.parent) {
        labelMesh.parent.remove(labelMesh);
      }
      if (labelMesh.geometry) labelMesh.geometry.dispose();
      if (labelMesh.material) {
        if (labelMesh.material.map) labelMesh.material.map.dispose();
        labelMesh.material.dispose();
      }
      if (ghostLabelMesh) ghostLabelMesh.visible = false;
      saveToLocalStorage();
    }

    function attachLabelAnywhere(intersect) {
      if (window.__DISABLE_LABEL_EDITING__ || window.__IS_COPY_VERSION__) return;
      const hitObj = intersect.object;
      const hitFace = intersect.face;
      if (!hitObj || !hitFace) return;

      const labelTex = generateLabelTexture(labelState.text || 'LABEL', labelState.color, labelState.width, labelState.height);
      const labelGeo = new THREE.PlaneGeometry(labelState.width, labelState.height);
      const labelMat = new THREE.MeshBasicMaterial({
        map: labelTex,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        polygonOffsetUnits: -1
      });

      const labelMesh = new THREE.Mesh(labelGeo, labelMat);

      const localPoint = hitObj.worldToLocal(intersect.point.clone());
      const localNormal = hitFace.normal.clone().normalize();

      labelMesh.position.copy(localPoint).addScaledVector(localNormal, 0.0035);

      const upVector = new THREE.Vector3(0, 1, 0);
      if (Math.abs(localNormal.y) > 0.85) {
        upVector.set(0, 0, -1);
      } else {
        upVector.set(0, 1, 0);
      }

      const targetLook = labelMesh.position.clone().add(localNormal);
      labelMesh.up.copy(upVector);
      labelMesh.lookAt(targetLook);

      labelMesh.userData = {
        isCartLabel: true,
        labelText: labelState.text,
        labelColor: labelState.color,
        labelWidth: labelState.width,
        labelHeight: labelState.height,
        partId: hitObj.userData.cartPartId || 'mesh_cabinet'
      };

      hitObj.add(labelMesh);
      allPlacedLabels.push(labelMesh);

      playTapeSound();

      document.getElementById('status-face').textContent = 'Label Stuck';
      document.getElementById('status-title').textContent = `"${labelState.text}" Placed`;
      document.getElementById('status-desc').textContent = `Custom label attached firmly to the cart.`;

      if (ghostLabelMesh) ghostLabelMesh.visible = false;
      saveToLocalStorage();
    }

    // =========================================================
    // --- BROWSER INTERNAL STORAGE & REPRODUCIBLE SAVE COPY ---
    // =========================================================
    const STORAGE_KEY = 'g10_medication_trolley_state';

    function getTrolleyState() {
      return {
        colors: {
          body: currentBodyColor,
          drawer: currentDrawerColor,
          bumper: currentBumperColor
        },
        labels: allPlacedLabels.map(lbl => ({
          partId: lbl.userData.partId,
          text: lbl.userData.labelText,
          color: lbl.userData.labelColor,
          width: lbl.userData.labelWidth,
          height: lbl.userData.labelHeight,
          pos: [lbl.position.x, lbl.position.y, lbl.position.z],
          rot: [lbl.quaternion.x, lbl.quaternion.y, lbl.quaternion.z, lbl.quaternion.w]
        }))
      };
    }

    function saveToLocalStorage() {
      if (window.__DISABLE_LABEL_EDITING__ || window.__IS_COPY_VERSION__) {
        return;
      }
      try {
        const state = getTrolleyState();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.warn('Unable to save to localStorage:', err);
      }
    }

    function loadFromLocalStorage() {
      if (window.__DISABLE_LABEL_EDITING__ || window.__IS_COPY_VERSION__) {
        return null;
      }
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (err) {
        console.warn('Unable to read from localStorage:', err);
      }
      return null;
    }

    function applyTrolleyState(state) {
      if (!state) return;

      // 1. Restore Custom Colors
      if (state.colors) {
        if (state.colors.body) {
          setMedCartBodyColor(state.colors.body);
          document.querySelectorAll('.cart-body-swatch').forEach(s => {
            s.classList.toggle('selected', s.getAttribute('data-color') === state.colors.body);
          });
        }
        if (state.colors.drawer) {
          setMedCartDrawerColor(state.colors.drawer);
          document.querySelectorAll('.cart-drawer-swatch').forEach(s => {
            s.classList.toggle('selected', s.getAttribute('data-color') === state.colors.drawer);
          });
        }
        if (state.colors.bumper) {
          setMedCartTrimColor(state.colors.bumper);
          document.querySelectorAll('.cart-bumper-swatch').forEach(s => {
            s.classList.toggle('selected', s.getAttribute('data-color') === state.colors.bumper);
          });
        }
      }

      // 2. Restore Custom Attached Labels
      if (Array.isArray(state.labels) && state.labels.length > 0) {
        const partMeshMap = {};
        cartGroup.traverse(child => {
          if (child.isMesh && child.userData?.cartPartId) {
            partMeshMap[child.userData.cartPartId] = child;
          }
        });

        state.labels.forEach(lbl => {
          const targetMesh = partMeshMap[lbl.partId];
          if (!targetMesh) return;

          const labelTex = generateLabelTexture(lbl.text || 'LABEL', lbl.color, lbl.width, lbl.height);
          const labelGeo = new THREE.PlaneGeometry(lbl.width, lbl.height);
          const labelMat = new THREE.MeshBasicMaterial({
            map: labelTex,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1
          });

          const labelMesh = new THREE.Mesh(labelGeo, labelMat);
          labelMesh.position.set(lbl.pos[0], lbl.pos[1], lbl.pos[2]);
          labelMesh.quaternion.set(lbl.rot[0], lbl.rot[1], lbl.rot[2], lbl.rot[3]);

          labelMesh.userData = {
            isCartLabel: true,
            labelText: lbl.text,
            labelColor: lbl.color,
            labelWidth: lbl.width,
            labelHeight: lbl.height,
            partId: lbl.partId
          };

          targetMesh.add(labelMesh);
          allPlacedLabels.push(labelMesh);
        });
      }
    }

    const btnSaveCopy = document.getElementById('btn-save-copy');
    if (btnSaveCopy) {
      btnSaveCopy.addEventListener('click', (e) => {
        e.stopPropagation();

        // 1. Save directly into browser internal memory (master copy only)
        saveToLocalStorage();

        const currentState = getTrolleyState();

        // 2. Clone the current HTML document
        const parser = new DOMParser();
        const docCopy = parser.parseFromString(document.documentElement.outerHTML, 'text/html');

        // 3. Remove the Save Button element from the reproduced copy
        const copySaveBtn = docCopy.getElementById('btn-save-copy');
        if (copySaveBtn) {
          copySaveBtn.remove();
        }

        // 4. Remove Label Maker toolbar button and panel
        const copyLabelBtn = docCopy.getElementById('btn-label-panel');
        if (copyLabelBtn) {
          copyLabelBtn.remove();
        }
        const copyLabelPanel = docCopy.getElementById('label-maker-panel');
        if (copyLabelPanel) {
          copyLabelPanel.remove();
        }

        // 5. Clear canvas container
        const webglContainer = docCopy.getElementById('webgl-container');
        if (webglContainer) {
          webglContainer.innerHTML = '';
        }

        // 6. Clean up active overlays
        docCopy.body.classList.remove('placing-mode-active');
        const cartPanel = docCopy.getElementById('cart-color-panel');
        if (cartPanel) {
          cartPanel.classList.add('hidden');
          cartPanel.classList.remove('flex');
        }

        // 7. Embed state & read-only isolate flags
        let embeddedScript = docCopy.getElementById('trolley-embedded-state');
        if (!embeddedScript) {
          embeddedScript = docCopy.createElement('script');
          embeddedScript.id = 'trolley-embedded-state';
          docCopy.head.appendChild(embeddedScript);
        }
        const safeStateJson = JSON.stringify(currentState).replace(/<\/script/gi, '<\\/script');
        embeddedScript.textContent = `
          window.__EMBEDDED_TROLLEY_DATA__ = ${safeStateJson};
          window.__DISABLE_LABEL_EDITING__ = true;
          window.__IS_COPY_VERSION__ = true;
        `;

        const finalHtml = '<!DOCTYPE html>\n' + docCopy.documentElement.outerHTML;

        // 8. Trigger download of the reproduced HTML file
        const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'G10_Interactive_Virtual_Medication_Trolley.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        playTapeSound();
        document.getElementById('status-face').textContent = 'Saved';
        document.getElementById('status-title').textContent = 'Saved to Memory & Exported';
        document.getElementById('status-desc').textContent = 'Master saved to memory. Standalone copy downloaded (100% read-only & isolated from browser memory).';
      });
    }

    // =========================================================
    // --- PRINT LABELS TO WORD FILE FUNCTIONALITY -------------
    // =========================================================
    // AMENDED (Point 4): Safely escape XML/HTML characters to prevent corrupted Word files
    function escapeHtmlForWord(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const btnPrintLabels = document.getElementById('btn-print-labels');
    if (btnPrintLabels) {
      btnPrintLabels.addEventListener('click', (e) => {
        e.stopPropagation();

        const labelTexts = allPlacedLabels
          .map(lbl => (lbl.userData && lbl.userData.labelText) ? lbl.userData.labelText.trim() : '')
          .filter(t => t.length > 0);

        if (labelTexts.length === 0) {
          alert('No labels found on the medication trolley to print.');
          return;
        }

        // Sort labels in natural alphabetical order (case-insensitive & numeric-aware)
        labelTexts.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

        const docContent = `
          <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
          <head>
            <meta charset='utf-8'>
            <title>Medication Trolley Labels</title>
            <style>
              body {
                font-family: Arial, Calibri, sans-serif;
                font-size: 12pt;
                font-weight: normal;
                font-style: normal;
                color: #000000;
                margin: 20mm;
              }
              p, div, span, li {
                font-family: Arial, Calibri, sans-serif;
                font-size: 12pt;
                font-weight: normal;
                font-style: normal;
                color: #000000;
                margin: 0;
                padding: 0;
              }
              .label-line {
                font-family: Arial, Calibri, sans-serif;
                font-size: 12pt;
                font-weight: normal;
                font-style: normal;
                color: #000000;
                margin-bottom: 8pt;
                line-height: 1.5;
              }
            </style>
          </head>
          <body>
            ${labelTexts.map((txt) => `<p class="label-line">${escapeHtmlForWord(txt)}</p>`).join('\n')}
          </body>
          </html>
        `;

        const blob = new Blob(['\ufeff' + docContent], { type: 'application/msword;charset=utf-8' });
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'G10_Medication_Trolley_Labels.doc';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        playTapeSound();
        document.getElementById('status-face').textContent = 'Printed';
        document.getElementById('status-title').textContent = 'Labels Exported to Word';
        document.getElementById('status-desc').textContent = 'All label words exported in alphabetical order as a Word file.';
      });
    }

    // Raycaster mouse interaction
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredDrawer = null;
    let pointerDownCoord = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      pointerDownCoord.x = e.clientX;
      pointerDownCoord.y = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (e.target !== renderer.domElement) {
        if (hoveredDrawer) {
          hoveredDrawer.material = drawerFaceMat;
          hoveredDrawer.material.color.set(currentDrawerColor);
          hoveredDrawer = null;
          document.body.style.cursor = 'default';
        }
        if (ghostLabelMesh) ghostLabelMesh.visible = false;
        return;
      }

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (!window.__DISABLE_LABEL_EDITING__ && !window.__IS_COPY_VERSION__) {
        const isPredicting = (labelState.isPlacing || labelState.isRelocating || (!labelMakerPanel.classList.contains('hidden') && !labelState.isRemoving && !selectedLabel));

        if (isPredicting) {
          document.body.style.cursor = 'crosshair';
          raycaster.setFromCamera(mouse, camera);
          const cartHits = raycaster.intersectObjects(cartGroup.children, true);
          const validHits = cartHits.filter(h =>
            h.object &&
            !h.object.userData?.isCartLabel &&
            h.object !== ghostLabelMesh &&
            (selectedLabel ? h.object !== selectedLabel : true) &&
            h.object.material?.visible !== false
          );

          if (validHits.length > 0) {
            const hit = validHits[0];
            const hitObj = hit.object;
            const hitFace = hit.face;

            if (hitFace) {
              const worldNormal = hitFace.normal.clone().applyQuaternion(hitObj.getWorldQuaternion(new THREE.Quaternion())).normalize();
              const worldPos = hit.point.clone().addScaledVector(worldNormal, 0.0035);

              ghostLabelMesh.position.copy(worldPos);

              const upVector = new THREE.Vector3(0, 1, 0);
              if (Math.abs(worldNormal.y) > 0.85) {
                upVector.set(0, 0, -1);
              } else {
                upVector.set(0, 1, 0);
              }

              const targetLook = ghostLabelMesh.position.clone().add(worldNormal);
              ghostLabelMesh.up.copy(upVector);
              ghostLabelMesh.lookAt(targetLook);
              ghostLabelMesh.visible = true;

              // Live predictive status readout
              const hitPartName = hitObj.userData?.drawerData?.name || hitObj.userData?.customItem?.name || 'Medication Cart Surface';
              document.getElementById('status-face').textContent = labelState.isRelocating ? 'Relocate Preview' : 'Label Preview';
              document.getElementById('status-title').textContent = `Target: ${hitPartName}`;
              document.getElementById('status-desc').textContent = `Size: ${(labelState.width * 100).toFixed(0)}cm × ${(labelState.height * 100).toFixed(0)}cm • Click to place here.`;
            }
          } else {
            ghostLabelMesh.visible = false;
          }
          return;
        } else {
          if (ghostLabelMesh) ghostLabelMesh.visible = false;
        }

        if (labelState.isRemoving) {
          raycaster.setFromCamera(mouse, camera);
          const labelHits = raycaster.intersectObjects(allPlacedLabels, false);
          document.body.style.cursor = (labelHits.length > 0) ? 'pointer' : 'default';
          return;
        }

        // Hover effect for existing labels to show they are clickable
        raycaster.setFromCamera(mouse, camera);
        const labelHits = raycaster.intersectObjects(allPlacedLabels, false);
        if (labelHits.length > 0) {
          document.body.style.cursor = 'pointer';
          return;
        }
      }

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);

      // AMENDED (Point 1): Restores default drawerFaceMat on prior drawer to prevent permanent glow
      if (intersects.length > 0) {
        const hit = intersects[0].object;
        const targetMesh = hit.userData.drawerData?.isSlidingDoor ? s2DoorMesh : hit;
        if (hoveredDrawer !== targetMesh) {
          if (hoveredDrawer) {
            hoveredDrawer.material = drawerFaceMat;
            hoveredDrawer.material.color.set(currentDrawerColor);
          }
          hoveredDrawer = targetMesh;
          hoveredDrawer.material = drawerHoverMat;
          document.body.style.cursor = 'pointer';
        }
      } else {
        if (hoveredDrawer) {
          hoveredDrawer.material = drawerFaceMat;
          hoveredDrawer.material.color.set(currentDrawerColor);
          hoveredDrawer = null;
          document.body.style.cursor = 'default';
        }
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target !== renderer.domElement) {
        return;
      }

      const diffX = Math.abs(e.clientX - pointerDownCoord.x);
      const diffY = Math.abs(e.clientY - pointerDownCoord.y);
      const tapThreshold = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 18 : 8;
      if (diffX > tapThreshold || diffY > tapThreshold) {
        return;
      }

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      if (!window.__DISABLE_LABEL_EDITING__ && !window.__IS_COPY_VERSION__) {
        // 1. Relocating Selected Label
        if (labelState.isRelocating && selectedLabel) {
          const cartHits = raycaster.intersectObjects(cartGroup.children, true);
          const validHits = cartHits.filter(h =>
            h.object &&
            !h.object.userData?.isCartLabel &&
            h.object !== selectedLabel &&
            h.object !== ghostLabelMesh &&
            h.object.material?.visible !== false
          );
          if (validHits.length > 0) {
            relocateSelectedLabel(validHits[0]);
            setRelocateMode(false);
            return;
          }
        }

        // 2. Label Removing Mode
        if (labelState.isRemoving) {
          const labelHits = raycaster.intersectObjects(allPlacedLabels, false);
          if (labelHits.length > 0) {
            const clickedLabel = labelHits[0].object;
            removeSingleLabel(clickedLabel);
            playTapeSound();
            document.getElementById('status-face').textContent = 'Removed';
            document.getElementById('status-title').textContent = 'Label Removed';
            document.getElementById('status-desc').textContent = 'Selected label was peeled off the cart.';
          }
          return;
        }

        // 3. Label Placing Mode (New Label)
        if (labelState.isPlacing) {
          const cartHits = raycaster.intersectObjects(cartGroup.children, true);
          const validHits = cartHits.filter(h =>
            h.object &&
            !h.object.userData?.isCartLabel &&
            h.object !== ghostLabelMesh &&
            h.object.material?.visible !== false
          );

          if (validHits.length > 0) {
            attachLabelAnywhere(validHits[0]);
            return;
          }
        }

        // 4. Click directly on an Existing Label to Select / Edit / Resize / Relocate
        const labelHits = raycaster.intersectObjects(allPlacedLabels, false);
        if (labelHits.length > 0) {
          selectLabelForEditing(labelHits[0].object);
          return;
        }
      }

      // 5. Normal Drawer / Door / Custom Items Interaction
      const allHits = raycaster.intersectObjects(cartGroup.children, true);
      if (allHits.length > 0) {
        let curr = allHits[0].object;
        let drawerData = null;
        let customItem = null;

        while (curr && curr !== cartGroup) {
          if (curr.userData && curr.userData.drawerData) {
            drawerData = curr.userData.drawerData;
            break;
          }
          if (curr.userData && curr.userData.customItem) {
            customItem = curr.userData.customItem;
            break;
          }
          curr = curr.parent;
        }

        if (customItem) {
          document.getElementById('status-face').textContent = customItem.face;
          document.getElementById('status-title').textContent = customItem.name;
          document.getElementById('status-desc').textContent = customItem.desc;
          playTapeSound();
        } else if (drawerData) {
          toggleDrawer(drawerData);
        }
      }
    });

    function toggleDrawer(drawer) {
      drawer.isOpen = !drawer.isOpen;
      drawer.targetProgress = drawer.isOpen ? 1.0 : 0.0;
      playDrawerSound(drawer.isOpen);
      updateStatusCard(drawer);
    }

    function closeAllDrawers() {
      let anyOpen = false;
      drawersList.forEach(drawer => {
        if (drawer.isOpen) {
          drawer.isOpen = false;
          drawer.targetProgress = 0.0;
          anyOpen = true;
        }
      });
      if (anyOpen) {
        playDrawerSound(false);
      }
      document.getElementById('status-face').textContent = 'Action';
      document.getElementById('status-title').textContent = 'All Drawers & Door Reset';
      document.getElementById('status-desc').textContent = 'All compartments and sliding door returned to default closed positions.';
    }

    function updateStatusCard(drawer) {
      const faceBadge = document.getElementById('status-face');
      const titleEl = document.getElementById('status-title');
      const descEl = document.getElementById('status-desc');

      faceBadge.textContent = drawer.face;
      titleEl.textContent = `${drawer.name}`;

      if (drawer.isSlidingDoor) {
        descEl.textContent = drawer.isOpen
          ? 'Status: Slid Right • Left side of the 3 large shelf compartments is now revealed.'
          : 'Status: Slid Left • Right side of the 3 large shelf compartments is now revealed.';
      } else {
        descEl.textContent = drawer.isOpen
          ? 'Status: Open • Clean, empty compartment interior visible.'
          : 'Status: Closed • Drawer aligned with cart panel.';
      }
    }

    const cameraTargets = {
      isometric: { pos: new THREE.Vector3(2.9, 2.3, 3.4), look: new THREE.Vector3(0, 1.25, 0) },
      front: { pos: new THREE.Vector3(0, 1.24, 3.5), look: new THREE.Vector3(0, 1.24, 0) },
      back: { pos: new THREE.Vector3(0, 1.24, -3.5), look: new THREE.Vector3(0, 1.24, 0) },
      side1: { pos: new THREE.Vector3(3.5, 1.24, 0), look: new THREE.Vector3(0, 1.24, 0) },
      side2: { pos: new THREE.Vector3(-3.5, 1.24, 0), look: new THREE.Vector3(0, 1.24, 0) }
    };

    let cameraLerp = null;

    function transitionToView(viewKey) {
      const target = cameraTargets[viewKey];
      if (!target) return;

      cameraLerp = {
        startPos: camera.position.clone(),
        endPos: target.pos.clone(),
        startLook: controls.target.clone(),
        endLook: target.look.clone(),
        startTime: performance.now(),
        duration: 900
      };

      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.getAttribute('data-view') === viewKey) {
          btn.classList.add('active-nav');
        } else {
          btn.classList.remove('active-nav');
        }
      });
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const view = btn.getAttribute('data-view');
        transitionToView(view);
      });
    });

    document.getElementById('btn-close-all').addEventListener('click', (e) => {
      e.stopPropagation();
      closeAllDrawers();
    });

    const rotateBtn = document.getElementById('btn-autorotate');
    const rotateLabel = document.getElementById('rotate-label');
    rotateBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      controls.autoRotate = !controls.autoRotate;
      rotateLabel.textContent = controls.autoRotate ? 'Spin: On' : 'Spin: Off';
      rotateBtn.classList.toggle('bg-blue-50', controls.autoRotate);
    });

    const soundBtn = document.getElementById('btn-sound');
    const soundIcon = document.getElementById('sound-icon');
    const soundLabel = document.getElementById('sound-label');
    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isSoundEnabled = !isSoundEnabled;
      soundIcon.textContent = isSoundEnabled ? '🔊' : '🔇';
      soundLabel.textContent = isSoundEnabled ? 'Audio On' : 'Muted';
      if (isSoundEnabled) initAudio();
    });

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      // AMENDED (Point 3): Clamped delta prevents drawers from leaping away after tab switching
      const delta = Math.min(clock.getDelta(), 0.1);

      if (cameraLerp) {
        const elapsed = performance.now() - cameraLerp.startTime;
        const rawT = Math.min(1.0, elapsed / cameraLerp.duration);
        const t = rawT < 0.5 ? 4 * rawT * rawT * rawT : 1 - Math.pow(-2 * rawT + 2, 3) / 2;

        camera.position.lerpVectors(cameraLerp.startPos, cameraLerp.endPos, t);
        controls.target.lerpVectors(cameraLerp.startLook, cameraLerp.endLook, t);

        if (rawT >= 1.0) {
          cameraLerp = null;
        }
      }

      drawersList.forEach(drawer => {
        if (drawer.isSlidingDoor) {
          if (Math.abs(drawer.progress - drawer.targetProgress) > 0.001) {
            drawer.progress += (drawer.targetProgress - drawer.progress) * 12 * delta;
            const currentZ = THREE.MathUtils.lerp(drawer.posLeft, drawer.posRight, drawer.progress);
            drawer.mesh.position.z = currentZ;
          }
        } else {
          if (Math.abs(drawer.progress - drawer.targetProgress) > 0.001) {
            drawer.progress += (drawer.targetProgress - drawer.progress) * 14 * delta;
            drawer.group.position.lerpVectors(drawer.closedPos, drawer.openPos, drawer.progress);
          }
        }
      });

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = function() {
      tagCartMeshes();

      const savedData = window.__EMBEDDED_TROLLEY_DATA__ || loadFromLocalStorage();
      if (savedData) {
        applyTrolleyState(savedData);
      }

      updateLivePreview();
      updateGhostLabelPreview();
      animate();
    };
  </script>

</body></html>
